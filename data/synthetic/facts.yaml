  - {code: PRV-HIP-120, title: HIPAA Security Awareness, req: hipaa_security, minutes: 25, modality: e-learning, recert_months: 12, languages: [en, es]}
  - {code: HR-HAR-100, title: Harassment Prevention for Employees, req: harassment, minutes: 60, modality: interactive e-learning, recert_months: 24, languages: [en, es, zh]}
  - {code: HR-HAR-200, title: Harassment Prevention for Supervisors, req: harassment, minutes: 120, modality: interactive e-learning, recert_months: 24, languages: [en, es]}
  - {code: EHS-FL-101, title: Forklift Operator Fundamentals, req: forklift, minutes: 240, modality: classroom + practical, recert_months: null, languages: [en, es]}
  - {code: EHS-FL-201, title: Forklift Practical Evaluation, req: forklift, minutes: 60, modality: practical evaluation, recert_months: 36, languages: [en, es]}
  - {code: EHS-FL-210, title: Forklift Annual Refresher, req: forklift, minutes: 30, modality: e-learning, recert_months: 12, languages: [en, es]}
  - {code: EHS-RSP-110, title: Respiratory Protection and Fit Test, req: respirator, minutes: 90, modality: classroom + fit test, recert_months: 12, languages: [en, es]}
  - {code: EHS-LOTO-150, title: Lockout/Tagout for Authorized Employees, req: loto, minutes: 180, modality: classroom + practical, recert_months: 24, languages: [en]}
  - {code: EHS-LOTO-050, title: Lockout/Tagout Awareness, req: loto, minutes: 20, modality: e-learning, recert_months: null, languages: [en, es]}
  - {code: EHS-HC-100, title: Hazard Communication and GHS Labels, req: hazcom, minutes: 40, modality: e-learning, recert_months: 36, languages: [en, es]}
  - {code: EHS-FE-100, title: Portable Fire Extinguisher Use, req: fire_ext, minutes: 45, modality: hands-on, recert_months: 12, languages: [en]}
  - {code: EHS-HCP-100, title: Hearing Conservation, req: hearing, minutes: 30, modality: e-learning, recert_months: 12, languages: [en, es]}
  - {code: EHS-CS-300, title: Confined Space Entrant, Attendant and Supervisor, req: confined_space, minutes: 480, modality: classroom + practical, recert_months: 24, languages: [en]}

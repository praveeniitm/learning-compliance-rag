# Single source of truth for the synthetic organization.
# Every synthetic document is rendered from these facts by data/generate_synthetic.py, so the
# documents stay mutually consistent except where inconsistency is injected on purpose
# (see `injected_conflicts`). The evaluation set is written against these same facts.

org:
  name: Northwind Manufacturing & Health
  short: Northwind
  employees: 4800
  compliance_office: Compliance Office (compliance@northwind.example)
  ehs_lead: Dana Whitfield, Director of Environmental Health & Safety
  lms_owner: Priya Raman, Learning Systems Manager
  cco: Marcus Ellery, Chief Compliance Officer

sites:
  - {code: DAY, name: Dayton Assembly Plant, state: OH, type: manufacturing, headcount: 1650}
  - {code: FRE, name: Fresno Distribution Center, state: CA, type: distribution, headcount: 980}
  - {code: REN, name: Reno Components Plant, state: NV, type: manufacturing, headcount: 1120}
  - {code: FCL, name: Fresno Occupational Health Clinic, state: CA, type: clinic, headcount: 310}
  - {code: CLB, name: Columbus Occupational Health Clinic, state: OH, type: clinic, headcount: 240}
  - {code: HQ,  name: Columbus Headquarters, state: OH, type: office, headcount: 500}

policy:
  id: POL-CT-001
  current:
    version: "3.2"
    effective: 2026-01-01
    approved_by: Marcus Ellery, Chief Compliance Officer
    new_hire_window_days: 30
    role_change_window_days: 14
    grace_days_annual: 15
    early_completion_window_days: 60
    harassment_scope: all U.S. employees
    hipaa_refresher: annual
    forklift_annual_refresher: true
    records_retention_years_default: 5
  superseded:
    version: "3.1"
    effective: 2024-07-01
    superseded_on: 2026-01-01
    new_hire_window_days: 45
    role_change_window_days: 30
    grace_days_annual: 30
    early_completion_window_days: 60
    harassment_scope: employees located in California, New York, Illinois and Connecticut
    hipaa_refresher: every two years
    forklift_annual_refresher: false
    records_retention_years_default: 5

# Requirement -> interval. `legal_basis` is what the regulation requires; `policy_rule` is what
# Northwind requires. When they differ, the policy is stricter (never looser) by design.
requirements:
  - key: bbp
    topic: Bloodborne pathogens
    legal_basis: "29 CFR 1910.1030(g)(2)"
    legal_interval: at initial assignment and at least annually thereafter
    policy_rule: at initial assignment (before any task with occupational exposure) and every 12 months
    safety_critical: true
  - key: hipaa_privacy
    topic: HIPAA privacy
    legal_basis: "45 CFR 164.530(b)"
    legal_interval: within a reasonable period after joining the workforce and after a material change in policies; no fixed refresher interval
    policy_rule: within 30 days of hire and every 12 months
    safety_critical: false
  - key: hipaa_security
    topic: HIPAA security awareness
    legal_basis: "45 CFR 164.308(a)(5)"
    legal_interval: security awareness and training program for all workforce members; no fixed refresher interval
    policy_rule: within 30 days of hire and every 12 months
    safety_critical: false
  - key: harassment
    topic: Sexual harassment and abusive conduct prevention
    legal_basis: "Cal. Gov. Code 12950.1"
    legal_interval: "California: 2 hours for supervisors and 1 hour for nonsupervisory employees, once every two years; within six months of hire or promotion"
    policy_rule: all U.S. employees every 24 months; new hires within 30 days; new supervisors within 30 days of promotion
    safety_critical: false
  - key: forklift
    topic: Powered industrial truck (forklift) operation
    legal_basis: "29 CFR 1910.178(l)"
    legal_interval: training and evaluation before operating; performance evaluation at least once every three years; refresher after unsafe operation, accident or near-miss, failed evaluation, different truck type, or changed workplace conditions
    policy_rule: initial training and practical evaluation before operating; practical re-evaluation every 36 months; annual online refresher module
    safety_critical: true
  - key: respirator
    topic: Respiratory protection
    legal_basis: "29 CFR 1910.134(k) and (f)"
    legal_interval: training before use and retraining annually; fit test before initial use and at least annually
    policy_rule: training and fit test before first use and every 12 months
    safety_critical: true
  - key: loto
    topic: Lockout/tagout (control of hazardous energy)
    legal_basis: "29 CFR 1910.147(c)(7)"
    legal_interval: initial training; retraining on changes in job assignment, equipment or processes, or when inspection reveals deviations; periodic inspection of procedures at least annually
    policy_rule: authorized employees every 24 months plus event-driven retraining; affected employees awareness at hire
    safety_critical: true
  - key: hazcom
    topic: Hazard communication (GHS)
    legal_basis: "29 CFR 1910.1200(h)"
    legal_interval: at time of initial assignment and whenever a new chemical hazard is introduced
    policy_rule: at initial assignment, when a new hazard is introduced, and every 36 months
    safety_critical: false
  - key: fire_ext
    topic: Portable fire extinguisher use
    legal_basis: "29 CFR 1910.157(g)"
    legal_interval: upon initial employment and at least annually thereafter (where employees are expected to use extinguishers)
    policy_rule: designated extinguisher users at hire and every 12 months
    safety_critical: false
  - key: hearing
    topic: Hearing conservation
    legal_basis: "29 CFR 1910.95(k)"
    legal_interval: training program repeated annually for employees in the hearing conservation program
    policy_rule: every 12 months for employees at or above 85 dBA TWA
    safety_critical: false
  - key: confined_space
    topic: Permit-required confined spaces
    legal_basis: "29 CFR 1910.146(g)"
    legal_interval: before first assignment, before a change in duties, on new hazards, or when deviations are observed
    policy_rule: before first assignment and every 24 months
    safety_critical: true
  - key: eap
    topic: Emergency action plan
    legal_basis: "29 CFR 1910.38(e)"
    legal_interval: review plan with each employee when the plan is developed, when responsibilities change, and when the plan changes
    policy_rule: at hire, on site transfer, and when the site plan changes
    safety_critical: false
  - key: coc
    topic: Code of conduct
    legal_basis: none (internal requirement)
    legal_interval: not legally required
    policy_rule: all employees at hire and every 12 months
    safety_critical: false

courses:

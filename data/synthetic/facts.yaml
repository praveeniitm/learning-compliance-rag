  - {code: MFG-SUP, title: Production Supervisor, sites: [DAY, REN], supervisor: true, curriculum: [EHS-HC-100, EHS-LOTO-050, EHS-HCP-100, EHS-EAP-100, EHS-FE-100, HR-HAR-200, ETH-COC-100]}

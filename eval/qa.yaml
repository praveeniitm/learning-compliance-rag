# Held-out evaluation set for the compliance-training assistant.
#
# Fields
#   id, type, question
#   gold:        relevant passages as [doc_id, anchor]. A retrieved chunk is relevant if it belongs to
#                doc_id and covers an anchor equal to, or nested under, the gold anchor
#                ("(l)(4)" covers "(l)(4)(iii)"; "7" covers "7.2"). An empty anchor means "any part".
#                Relevance is defined on document structure, not chunk ids, so every chunking
#                strategy is scored against the same ground truth.
#   key_facts:   regexes that a correct answer must all match (case-insensitive). They check the
#                facts that matter (numbers, course codes, the law-vs-policy distinction), not wording.
#   expect:      expected status: answered | needs_clarification | insufficient_context | out_of_scope
#
# Question types
#   policy_fact    single internal-document lookup
#   reg_fact       single regulation lookup
#   law_vs_policy  must separate the legal requirement from the stricter internal rule
#   multi_doc      needs two or more documents (role -> curriculum -> course -> interval)
#   identifier     exact course code / citation lookups, where keyword search should matter
#   version        superseded policy / change history
#   conflict       an informal source contradicts policy; the answer must follow policy
#   ambiguous      underspecified; should ask for clarification
#   insufficient   in-domain, but the corpus does not contain the answer
#   out_of_scope   not about compliance training
#
# Authoring note: questions were written from facts.yaml and the regulation text *before* running
# any experiment on them. The dev/test split is assigned by eval/split.py (seeded, stratified by type).


[project]
name = "lcrag"
version = "0.1.0"
description = "Grounded question answering over compliance-training regulations, policies and course catalogs"
requires-python = ">=3.11,<3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

name: ci
on:
  push:
  pull_request:
  workflow_dispatch:  # a manual run also executes the (paid) evaluation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.11 && uv pip install -r requirements.txt -e .
      - run: .venv/bin/python -m pytest -q tests  # offline: no API key needed

  eval:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.11 && uv pip install -r requirements.txt -e .
      - run: .venv/bin/python eval/evaluate.py safety
      - run: .venv/bin/python eval/evaluate.py e2e
      - name: Quality gate (test split)
        run: |
          .venv/bin/python - <<'EOF'
          import json, sys
          rows = [r for r in json.load(open("results/e2e.json")) if r["split"] == "test"]
          def mean(k):
              xs = [r[k] for r in rows if r.get(k) is not None]
              return sum(xs) / len(xs)
          gate = {"faithfulness_verified": 0.95, "key_facts_ok": 0.85, "status_ok": 0.85}
          bad = {k: round(mean(k), 3) for k, t in gate.items() if mean(k) < t}
          sys.exit(f"quality gate failed: {bad}" if bad else 0)
          EOF
      - uses: actions/upload-artifact@v4
        with: {name: results, path: results/}
